name: Build MOS-KulKul

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-mos-dock.yml"

permissions:
  contents: read

jobs:
  windows:
    name: Windows Setup.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish MOS-KulKul.exe
        run: |
          dotnet publish desktop/MosDock/MosDock.csproj -c Release -o dist-win
          Copy-Item desktop/installer/windows/install.ps1 dist-win/
          if (-not (Test-Path dist-win\MOS-KulKul.exe)) { throw "MOS-KulKul.exe missing after publish" }
          Get-ChildItem dist-win | Format-Table Name, Length
      - name: Compile full Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: desktop/installer/windows/mosdock.iss
          options: /DDist="${{ github.workspace }}\dist-win"
      - name: Compile small web stub installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: desktop/installer/windows/mosdock-web.iss
      - name: Check stub is small and full payload exists
        shell: pwsh
        run: |
          $stub = Get-Item dist-installer\MOS-KulKul-Setup-Windows.exe
          $full = Get-Item dist-installer\MOS-KulKul-Setup-Windows-Full.exe
          Write-Host "stub=$($stub.Length) full=$($full.Length)"
          if ($stub.Length -gt 8MB) { throw "Web stub too large: $($stub.Length)" }
          if ($full.Length -lt 20MB) { throw "Full installer too small: $($full.Length)" }
          Compress-Archive -Path $stub.FullName -DestinationPath dist-installer\MOS-KulKul-Setup-Windows.zip -Force
          Compress-Archive -Path $full.FullName -DestinationPath dist-installer\MOS-KulKul-Setup-Windows-Full.zip -Force
          Get-FileHash dist-installer\MOS-KulKul-Setup-Windows.zip, dist-installer\MOS-KulKul-Setup-Windows-Full.zip, $stub.FullName, $full.FullName -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), $_.Path } |
            Set-Content -Encoding ascii dist-installer\SHA256.txt
          Get-Content dist-installer\SHA256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: MOS-KulKul-Setup-Windows
          path: |
            dist-installer/MOS-KulKul-Setup-Windows.exe
            dist-installer/MOS-KulKul-Setup-Windows.zip
            dist-installer/MOS-KulKul-Setup-Windows-Full.exe
            dist-installer/MOS-KulKul-Setup-Windows-Full.zip
            dist-installer/SHA256.txt
            dist-win/MOS-KulKul.exe
            dist-win/install.ps1

  macos-zip:
    name: macOS Setup.zip (source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build zip installer
        run: bash desktop/installer/macos/make-zip.sh
      - uses: actions/upload-artifact@v7
        with:
          name: MOS-KulKul-Setup-macOS-src
          path: dist-installer/MOS-KulKul-Setup-macOS.zip

  macos:
    name: macOS Setup.app + .pkg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build app, zip, and pkg
        run: bash desktop/installer/macos/build-pkg.sh
      - name: Check Mac installer names and hashes
        run: |
          test -f dist-installer/MOS-KulKul-Setup-macOS.zip
          test -f dist-installer/MOS-KulKul-Setup-macOS.pkg
          test -f dist-installer/SHA256-macOS.txt
          test ! -e dist-installer/MOS-Dock*
          python3 - <<'PY'
          from pathlib import Path
          z = Path("dist-installer/MOS-KulKul-Setup-macOS.zip")
          p = Path("dist-installer/MOS-KulKul-Setup-macOS.pkg")
          if z.stat().st_size < 4000:
              raise SystemExit(f"zip too small: {z.stat().st_size}")
          if p.stat().st_size < 8000:
              raise SystemExit(f"pkg too small: {p.stat().st_size}")
          print(z.stat().st_size, p.stat().st_size)
          print(Path("dist-installer/SHA256-macOS.txt").read_text())
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: MOS-KulKul-Setup-macOS
          path: |
            dist-installer/MOS-KulKul-Setup-macOS.zip
            dist-installer/MOS-KulKul-Setup-macOS.pkg
            dist-installer/SHA256-macOS.txt

  release:
    name: Publish GitHub Release
    needs: [windows, macos, macos-zip]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: MOS-KulKul-Setup-Windows
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: MOS-KulKul-Setup-macOS
          path: release/macos
      - name: Collect release assets
        id: assets
        run: |
          set -euo pipefail
          version="$(grep -oP '(?<=<Version>)[^<]+' desktop/MosDock/MosDock.csproj | head -n1)"
          test -n "$version" || { echo "Version missing in MosDock.csproj"; exit 1; }
          mkdir -p release/assets
          cp release/windows/dist-installer/MOS-KulKul-Setup-Windows-Full.exe release/assets/
          cp release/windows/dist-installer/MOS-KulKul-Setup-Windows-Full.zip release/assets/
          cp release/windows/dist-installer/MOS-KulKul-Setup-Windows.exe release/assets/
          cp release/windows/dist-installer/MOS-KulKul-Setup-Windows.zip release/assets/
          cp release/macos/MOS-KulKul-Setup-macOS.pkg release/assets/
          cp release/macos/MOS-KulKul-Setup-macOS.zip release/assets/
          (cd release/assets && sha256sum ./* | sed 's#  \./#  #' > SHA256-release.txt)
          cat release/assets/SHA256-release.txt
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.assets.outputs.version }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          tag="$VERSION"
          title="MOS-KulKul $VERSION"
          summary="$(printf '%s' "$SUBJECT" | head -n1)"
          [ -n "$summary" ] || summary="Bản build từ nhánh main."
          notes="$(cat <<EOF
          $summary

          Cài **MOS-KulKul-Setup-Windows-Full.exe** (bản đầy đủ, không cần Admin). File MOS-KulKul-Setup-Windows.exe ~2MB chỉ là stub tải về, không dùng khi cài offline.
          macOS: mở **MOS-KulKul-Setup-macOS.pkg** hoặc giải nén **MOS-KulKul-Setup-macOS.zip**.

          Commit: ${GITHUB_SHA}
          EOF
          )"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag exists; replacing assets."
            gh release upload "$tag" release/assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes" --latest
          else
            gh release create "$tag" release/assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --latest
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets --jq '{tagName,url,assets:[.assets[].name]}'
