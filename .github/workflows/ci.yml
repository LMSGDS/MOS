name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate MOS web app
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mos
          POSTGRES_PASSWORD: mos
          POSTGRES_DB: mos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mos:mos@localhost:5432/mos
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install -r requirements.txt pytest httpx
          python -m pytest -q tests
          test -f app/static/mau-van-ban.docx
          test -f app/static/mau-bang-tinh.xlsx
          test -f app/static/mau-bai-trinh-bay.pptx
          test -f deploy/nginx-mos.gds.edu.vn.conf
          test -f desktop/MosDock/MosDock.csproj
          test -f desktop/MosDockMac/mosdock_mac.py
          test -f desktop/installer/windows/mosdock.iss
          test -f desktop/installer/windows/install.ps1
          test -f desktop/installer/macos/build-pkg.sh
          test -f app/schema.sql
          test -f scripts/git-sync.sh
          test -f deploy/mos-git-sync.timer
          test -f desktop/MosDock/ExamHub.cs
          test -f desktop/MosDock/WordGrade.cs
          test -f app/grade.py
          test -f app/rubrics/word-objective-1-1.json
          test -f data/projects/word-objective-1-1/Word_1-1.docx
          test -f tests/fixtures/word-objective-1-1/Word_1-1.docx
          test -f tests/fixtures/word-objective-1-1/Word_1-1_results.docx
