name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate GitHub automation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check automation scripts
        run: |
          chmod +x scripts/*.sh
          bash -n scripts/auto-commit.sh
          bash -n scripts/openvpn-up.sh
          bash -n scripts/openvpn-down.sh
          bash -n scripts/ssh-connect.sh
          test -f .github/workflows/auto-commit.yml
          test -f .github/workflows/ssh-openvpn.yml
          echo "GitHub auto-commit and OpenVPN SSH scripts are present."
