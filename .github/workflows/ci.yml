name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate MOS web app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and test
        run: |
          python -m pip install -r requirements.txt pytest httpx
          python -m pytest -q tests
          test -f app/static/mau-van-ban.docx
          test -f deploy/nginx-mos.gds.edu.vn.conf
          test -f desktop/MosDock/MosDock.csproj
