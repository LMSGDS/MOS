name: SSH via OpenVPN

on:
  workflow_dispatch:
    inputs:
      ssh_command:
        description: Remote command (empty opens a non-interactive hostname check)
        required: false
        default: "hostname && uname -a"

permissions:
  contents: read

jobs:
  connect:
    name: OpenVPN then SSH
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install OpenVPN
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openvpn iproute2 sshpass

      - name: Connect OpenVPN
        env:
          OPENVPN_CONFIG: ${{ secrets.OPENVPN_CONFIG }}
          OPENVPN_USERNAME: ${{ secrets.OPENVPN_USERNAME }}
          OPENVPN_PASSWORD: ${{ secrets.OPENVPN_PASSWORD }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: bash scripts/openvpn-up.sh

      - name: SSH to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: bash scripts/ssh-connect.sh "${{ inputs.ssh_command }}"
