<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#008EE2" />
  <title>{% block title %}MOS-KulKul · GDS{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&amp;family=Calibri:wght@400;700&amp;display=swap" rel="stylesheet" />
  <link rel="icon" href="/static/favicon.ico" />
  <link rel="apple-touch-icon" href="/static/kulkul.png" />
  <link rel="stylesheet" href="/static/mos.css?v={{ asset_v }}" />
</head>
<body class="{% block bodyclass %}{% endblock %}">
  {% block chrome %}
  <header class="top">
    <a class="brand" href="/">
      <img class="brand-logo" src="/static/kulkul.png" width="32" height="32" alt="" />
      <span class="mark">MOS-KulKul</span>
      <span class="sub">GDS · mos.gds.edu.vn</span>
    </a>
    {% if user %}
    <form method="post" action="/dang-xuat">
      <button class="ghost" type="submit">Đăng xuất</button>
    </form>
    {% endif %}
  </header>
  <main>{% block body %}{% endblock %}</main>
  <footer>Trường GDS · MOS-KulKul — Word · Excel · PowerPoint trên máy, không dùng Office Online</footer>
  {% endblock %}
</body>
</html>
