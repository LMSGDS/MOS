# Origin mos.gds.edu.vn — Cloudflare Full (strict) + Origin CA.
# Chứng chỉ: /etc/ssl/cloudflare/mos.gds.edu.vn.pem + .key (không lưu trong git).

server {
    listen 80;
    listen [::]:80;
    server_name mos.gds.edu.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mos.gds.edu.vn;

    include snippets/cloudflare-real-ip.conf;
    if ($cf_origin_ok = 0) { return 403; }

    ssl_certificate     /etc/ssl/cloudflare/mos.gds.edu.vn.pem;
    ssl_certificate_key /etc/ssl/cloudflare/mos.gds.edu.vn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/mos.access.log;
    error_log  /var/log/nginx/mos.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    client_max_body_size 8m;

    location /api/v1/classes/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
